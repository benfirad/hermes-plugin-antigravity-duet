name: daak-duffy
version: "0.3.0"
description: "Autonomous background task queue (DAAK Duffy 🦆 Do-For-You worker) with Human-in-the-Loop approval gates, dynamic multi-agent roster, Ruflo multi-agent swarm orchestration, and multi-model Antigravity CLI quota fallback for Hermes Agent."
author: "benfirad"
license: "MIT"
homepage: "https://github.com/benfirad/hermes-plugin-antigravity-duet"
requires_hermes: ">=0.21.0"
platforms:
  - linux
  - macos
provides_tools:
  - duet_queue
  - ruflo_swarm
provides_hooks: []
requires_env: []
config_schema:
  dashboard_port:
    type: int
    required: false
  agy_bin:
    type: str
    required: false
  ruflo_bin:
    type: str
    required: false
